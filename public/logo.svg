<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#68B030;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A7C957;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D5016;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main background -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGradient)" stroke="#2D5016" stroke-width="4"/>

  <!-- Sun -->
  <circle cx="75" cy="35" r="12" fill="#FFD700" opacity="0.9"/>
  <path d="M75 18 L75 22 M89 35 L85 35 M83 23 L80 26 M83 47 L80 44 M67 47 L70 44 M67 23 L70 26"
        stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>

  <!-- Cloud -->
  <ellipse cx="40" cy="30" rx="15" ry="8" fill="white" opacity="0.8"/>
  <circle cx="35" cy="25" r="6" fill="white" opacity="0.8"/>
  <circle cx="45" cy="25" r="8" fill="white" opacity="0.8"/>

  <!-- Main leaf/nature element -->
  <path d="M30 70 Q45 50 60 70 Q75 50 90 70 Q75 90 60 70 Q45 90 30 70 Z"
        fill="url(#leafGradient)" opacity="0.9"/>

  <!-- Leaf veins -->
  <path d="M45 65 Q52 60 60 70 Q68 60 75 65" stroke="#2D5016" stroke-width="1.5" fill="none"/>

  <!-- Weather symbols -->
  <!-- Raindrop -->
  <path d="M25 85 Q25 80 30 80 Q35 80 35 85 Q35 90 30 90 Q25 90 25 85 Z" fill="#4A90E2"/>

  <!-- Wind lines -->
  <path d="M85 75 L95 75 M85 80 L100 80 M85 85 L95 85" stroke="#9CAF88" stroke-width="2" stroke-linecap="round"/>

  <!-- VM text -->
  <text x="60" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="#2D5016">VM</text>
</svg>